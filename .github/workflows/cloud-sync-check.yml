name: Validate personal cloud synchronization
on:
  pull_request:
    paths:
      - index.html
      - cloud-workspace.js
      - tests/cloud-workspace.test.cjs
      - tests/ai-assistant.test.cjs
      - supabase/functions/acr-assistant/index.ts
      - .github/workflows/cloud-sync-check.yml
permissions:
  contents: read
jobs:
  synchronization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate scripts and synchronization behavior
        run: |
          node --check cloud-workspace.js
          node --test tests/cloud-workspace.test.cjs
          node tests/logic.test.cjs
          node --test tests/ai-assistant.test.cjs
      - name: Prepare existing browser regression suite
        run: |
          npm install --no-save playwright@1.57.0 jspdf@2.5.2 pptxgenjs@3.12.0
          mkdir -p vendor
          cp node_modules/jspdf/dist/jspdf.umd.min.js vendor/jspdf.umd.min.js
          cp node_modules/pptxgenjs/dist/pptxgen.bundle.js vendor/pptxgen.bundle.js
          npx playwright install --with-deps chromium
      - name: Run existing application regression suite
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/acr-http.log 2>&1 &
          node tests/ui-smoke.cjs
