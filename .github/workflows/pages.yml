name: Publicar ACR Intelligence Web
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar aplicación HTML y JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          assert "<!doctype html>" in html.lower() and "</html>" in html.lower()
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.S|re.I)
          assert scripts, "Falta el código JavaScript"
          Path("/tmp/acr-validate.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/acr-validate.js
          node tests/logic.test.cjs
          node --test tests/cloud-workspace.test.cjs
      - name: Preparar navegador para prueba funcional
        run: |
          npm install --no-save playwright@1.57.0 jspdf@2.5.2 pptxgenjs@3.12.0
          mkdir -p vendor
          cp node_modules/jspdf/dist/jspdf.umd.min.js vendor/jspdf.umd.min.js
          cp node_modules/pptxgenjs/dist/pptxgen.bundle.js vendor/pptxgen.bundle.js
          test -s vendor/jspdf.umd.min.js
          test -s vendor/pptxgen.bundle.js
          npx playwright install --with-deps chromium
      - name: Probar flujo completo en navegador
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/acr-http.log 2>&1 &
          sleep 2
          node tests/ui-smoke.cjs
      - uses: actions/configure-pages@v5
      - name: Preparar paquete web sin dependencias de pruebas
        run: |
          mkdir -p _site/vendor
          cp index.html _site/
          cp cloud-workspace.js _site/
          cp vendor/jspdf.umd.min.js _site/vendor/
          cp vendor/pptxgen.bundle.js _site/vendor/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Confirmar que GitHub registró el artefacto de Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 15); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)
            if [ "$count" -gt 0 ]; then
              echo "Artefacto github-pages confirmado por API."
              exit 0
            fi
            echo "El artefacto aún no es visible (intento $attempt/15)."
            sleep 8
          done
          echo "::error::GitHub aún no expone el artefacto github-pages."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4

